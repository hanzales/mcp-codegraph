spring:
  main:
    web-application-type: none
  ai:
    mcp:
      server:
        name: mcp-codegraph
        version: 0.1.0
        type: SYNC
        stdio: true
codegraph:
  graph:
    provider: in-memory
    uri: bolt://localhost:7687
    username: neo4j
    password: change-me
    database: neo4j
  security:
    redact-secrets: true
